# Render Blueprint: https://render.com/docs/blueprint-spec
# API only; the front end deploys to Vercel (see README). Values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: netsim-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build -w @netsim/shared && npm run build -w @netsim/server
    startCommand: npm run start -w @netsim/server
    healthCheckPath: /api/health
    autoDeployTrigger: off # deploys come from .github/workflows/deploy.yml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        sync: false # comma-separated allowed origins, e.g. your Vercel URL
