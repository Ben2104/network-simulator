name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Only after a green CI run of a push to main; never for PRs.
# API only: the front end deploys to Vercel through its own git integration.
jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: diff
        run: |
          # Diffs the CI run's head commit against its parent.
          if files=$(git diff --name-only HEAD^ HEAD 2>/dev/null); then
            echo "$files"
          else
            echo "::notice::No parent commit to diff; deploying the API"
            files="package.json"
          fi
          api=false
          echo "$files" | grep -Eq '^(apps/server/|packages/shared/|package(-lock)?\.json$|tsconfig\.base\.json$)' && api=true
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "api changed: $api"

  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prove shared and server build
        run: npm run build -w @netsim/shared && npm run build -w @netsim/server
      - name: Trigger Render deploy
        run: |
          # Hook URL is a credential: read from env only, never echoed.
          if [ -z "$RENDER_API_DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_API_DEPLOY_HOOK is not set; skipping API deploy"
            exit 0
          fi
          curl -fsS -o /dev/null -X POST "$RENDER_API_DEPLOY_HOOK"
          echo "Triggered API deploy"
